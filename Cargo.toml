[workspace]
members = [
    "sensevoice-desktop",
    "sensevoice-sys",
    "audio-processor",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["SenseVoice Team"]
license = "MIT"

[workspace.dependencies]
# 内部依赖
sensevoice-sys = { path = "./sensevoice-sys" }
sensevoice-audio-processor = { path = "./audio-processor" }

# 异步运行时
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# 日志
log = "0.4"
env_logger = "0.11"

# 错误处理
anyhow = "1.0"
thiserror = "1.0"

# 实用工具
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
dirs = "5.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.release-with-debug]
inherits = "release"
strip = false
debug = true

[profile.dev]
opt-level = 0
